<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>憨憨电台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #1a1a2e;
    color: #e0d4c3;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .container {
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .header {
    text-align: center;
    padding: 20px 0 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .header h1 { font-size: 20px; font-weight: 400; color: #f0c074; letter-spacing: 2px; }
  .header p  { font-size: 12px; color: #6a6a7a; margin-top: 4px; }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .message {
    max-width: 85%;
    line-height: 1.7;
    font-size: 15px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .message.user {
    align-self: flex-end;
    background: rgba(240,192,116,0.12);
    border-radius: 14px 14px 4px 14px;
    padding: 10px 14px;
  }
  .message.assistant {
    align-self: flex-start;
    color: #d4c8b8;
  }
  .message.assistant .name {
    font-size: 11px;
    color: #f0c074;
    margin-bottom: 4px;
  }
  .message.error {
    align-self: center;
    color: #c06060;
    font-size: 13px;
  }
  .spinner {
    display: inline-block;
    width: 6px; height: 6px;
    background: #f0c074;
    border-radius: 50%;
    animation: blink 0.6s infinite alternate;
    margin-left: 4px;
    vertical-align: middle;
  }
  @keyframes blink { to { opacity: 0.3; } }
  .input-area {
    padding: 12px 16px 24px;
    display: flex;
    gap: 8px;
  }
  .input-area input {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 10px 18px;
    color: #e0d4c3;
    font-size: 14px;
    outline: none;
  }
  .input-area input::placeholder { color: #5a5a6a; }
  .input-area button {
    background: #f0c074;
    color: #1a1a2e;
    border: none;
    border-radius: 20px;
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
  }
  .input-area button:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎙️ 憨憨电台</h1>
    <p>深夜 · 音乐 · 聊天</p>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <input id="input" type="text" placeholder="说点什么..." autocomplete="off">
    <button id="send" onclick="send()">发送</button>
  </div>
</div>

<script>
const sessionID = crypto.randomUUID();

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'message ' + role;
  if (role === 'assistant') {
    div.innerHTML = '<div class="name">🎙️ 憨憨</div>' + text;
  } else {
    div.textContent = text;
  }
  document.getElementById('messages').appendChild(div);
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
  return div;
}

let currentAssistantDiv = null;

async function send() {
  const input = document.getElementById('input');
  const btn = document.getElementById('send');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.disabled = true;
  btn.disabled = true;

  addMessage('user', text);
  currentAssistantDiv = addMessage('assistant', '<span class="spinner"></span>');

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionID, message: text }),
    });

    let firstChunk = true;
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // SSE format: "event: xxx\ndata: yyy\n\n"
      const parts = buffer.split('\n\n');
      buffer = parts.pop(); // keep incomplete chunk
      for (const part of parts) {
        const lines = part.split('\n');
        let event = '', data = '';
        for (const line of lines) {
          if (line.startsWith('event: ')) event = line.slice(7);
          else if (line.startsWith('data: ')) data = line.slice(6);
        }
        if (event === 'text') {
          if (firstChunk) {
            currentAssistantDiv.innerHTML = '<div class="name">🎙️ 憨憨</div>';
            firstChunk = false;
          }
          currentAssistantDiv.appendChild(document.createTextNode(data));
          document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        } else if (event === 'error') {
          addMessage('error', data);
        }
      }
    }
  } catch (err) {
    addMessage('error', err.message);
  }

  const spinner = currentAssistantDiv.querySelector('.spinner');
  if (spinner) spinner.remove();

  input.disabled = false;
  btn.disabled = false;
  input.focus();
}

document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter') send();
});
</script>
</body>
</html>

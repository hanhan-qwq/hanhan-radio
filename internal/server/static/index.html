<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>憨憨电台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #1a1a2e;
    color: #e0d4c3;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .container {
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .header {
    text-align: center;
    padding: 20px 0 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .header h1 { font-size: 20px; font-weight: 400; color: #f0c074; letter-spacing: 2px; }
  .live-dot {
    width: 8px; height: 8px;
    background: #40c040;
    border-radius: 50%;
    transition: background 0.3s;
  }
  .live-dot.paused { background: #e0a040; }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }
  .msg {
    line-height: 1.8;
    font-size: 15px;
    color: #d4c8b8;
    margin-bottom: 12px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg .prefix {
    color: #f0c074;
    font-size: 11px;
    margin-bottom: 2px;
  }
  .spinner {
    display: inline-block;
    width: 6px; height: 6px;
    background: #f0c074;
    border-radius: 50%;
    animation: blink 0.6s infinite alternate;
    margin-left: 6px;
    vertical-align: middle;
  }
  @keyframes blink { to { opacity: 0.3; } }
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 12px 16px;
  }
  .play-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1.5px solid #f0c074;
    background: transparent;
    color: #f0c074;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .play-btn:hover { background: rgba(240,192,116,0.1); }
  .play-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .state-label {
    font-size: 12px;
    color: #6a6a7a;
    min-width: 40px;
    text-align: center;
  }
  .state-label.playing { color: #40c040; }
  .state-label.paused { color: #e0a040; }
  .input-area {
    padding: 12px 16px 24px;
    display: flex;
    gap: 8px;
  }
  .input-area input {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 10px 18px;
    color: #e0d4c3;
    font-size: 14px;
    outline: none;
  }
  .input-area input::placeholder { color: #5a5a6a; }
  .input-area button {
    background: #f0c074;
    color: #1a1a2e;
    border: none;
    border-radius: 20px;
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <span class="live-dot" id="liveDot"></span>
    <h1>🎙️ 憨憨电台</h1>
  </div>

  <div class="controls">
    <span class="state-label" id="stateLabel">连接中</span>
    <button class="play-btn" id="playBtn" onclick="togglePlay()" disabled>▶</button>
  </div>

  <div class="messages" id="messages"></div>
  <div class="input-area">
    <input id="input" type="text" placeholder="插一句话..." autocomplete="off">
    <button onclick="speak()">说</button>
  </div>
</div>

<script>
let ws = null;
let currentMsgDiv = null;
let firstChunk = true;
let isPlaying = true;

function updateUI(state) {
  const dot = document.getElementById('liveDot');
  const btn = document.getElementById('playBtn');
  const label = document.getElementById('stateLabel');

  if (state === 'playing') {
    isPlaying = true;
    dot.className = 'live-dot';
    btn.textContent = '⏸';
    label.textContent = '播放中';
    label.className = 'state-label playing';
  } else if (state === 'paused') {
    isPlaying = false;
    dot.className = 'live-dot paused';
    btn.textContent = '▶';
    label.textContent = '已暂停';
    label.className = 'state-label paused';
  }
}

function togglePlay() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  if (isPlaying) {
    ws.send(JSON.stringify({ type: 'pause' }));
  } else {
    ws.send(JSON.stringify({ type: 'resume' }));
  }
}

function connect() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(protocol + '//' + location.host + '/ws');

  ws.onopen = () => {
    document.getElementById('playBtn').disabled = false;
    document.getElementById('input').disabled = false;
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);

    if (msg.type === 'state') {
      updateUI(msg.data);
      return;
    }

    if (msg.type === 'text') {
      if (!currentMsgDiv || firstChunk) {
        currentMsgDiv = document.createElement('div');
        currentMsgDiv.className = 'msg';
        currentMsgDiv.innerHTML = '<div class="prefix">🎙️ 憨憨</div>';
        document.getElementById('messages').appendChild(currentMsgDiv);
        firstChunk = false;
      }
      currentMsgDiv.appendChild(document.createTextNode(msg.data));
      document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    } else if (msg.type === 'done') {
      currentMsgDiv = null;
      firstChunk = true;
    } else if (msg.type === 'error') {
      const div = document.createElement('div');
      div.className = 'msg';
      div.style.color = '#c06060';
      div.textContent = msg.data;
      document.getElementById('messages').appendChild(div);
    }
  };

  ws.onclose = () => {
    document.getElementById('playBtn').disabled = true;
    document.getElementById('input').disabled = true;
    updateUI('paused');
    setTimeout(connect, 3000);
  };
}

function speak() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: 'speak', data: text }));
  input.value = '';
}

document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter') speak();
});

connect();
</script>
</body>
</html>
